name: UV-Vis numerical regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scientific-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent scientific reference packages
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Validate script and analytical invariants
        run: node --test tests/uvvis-regression.test.cjs
      - name: Compare production derivatives with SciPy and analytic functions
        run: python -m unittest discover -s tests -p scipy_reference.py -v
