name: UV-Vis numerical regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scientific-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script and analytical invariants
        run: node --test tests/uvvis-regression.test.cjs
