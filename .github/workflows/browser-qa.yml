name: UV-Vis browser smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Generate standard-library XLSX fixture
        run: python tests/make_xlsx_fixture.py
      - name: Run browser smoke tests
        run: node tests/browser-smoke.cjs
