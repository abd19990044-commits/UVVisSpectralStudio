name: UV-Vis browser smoke
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Generate standard-library XLSX fixture
        run: python tests/make_xlsx_fixture.py
      - name: Run browser smoke tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:browser
