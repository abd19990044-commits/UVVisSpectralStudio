name: Verify and deploy single-file app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  numerical:
    uses: ./.github/workflows/scientific-qa.yml
  browsers:
    uses: ./.github/workflows/browser-qa.yml
  deploy:
    needs: [numerical, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only distributable files
        run: |
          mkdir public
          cp index.html LICENSE NOTICE public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy verified app
        id: deployment
        uses: actions/deploy-pages@v5
  release-v1-3-1:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified v1.3.1 snapshot once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != '1.3.1' ]; then
            echo 'The one-time v1.3.1 release job is inactive for this version.'
            exit 0
          fi
          grep -Fqx 'version: "1.3.1"' CITATION.cff
          grep -Fqx 'doi: 10.5281/zenodo.22923131' CITATION.cff
          if gh release view 'v1.3.1' >/dev/null 2>&1; then
            echo 'v1.3.1 is already released.'
            exit 0
          fi
          gh release create 'v1.3.1' \
            --target "$GITHUB_SHA" \
            --title 'UV–Vis Spectral Studio v1.3.1' \
            --notes-file RELEASE_NOTES_v1.3.1.md \
            --latest
