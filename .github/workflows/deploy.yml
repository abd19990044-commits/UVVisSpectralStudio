name: Verify and deploy single-file app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  numerical:
    uses: ./.github/workflows/scientific-qa.yml
  browsers:
    uses: ./.github/workflows/browser-qa.yml
  deploy:
    needs: [numerical, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only distributable files
        run: |
          mkdir public
          cp index.html LICENSE NOTICE public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy verified app
        id: deployment
        uses: actions/deploy-pages@v5
